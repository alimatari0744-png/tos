name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Prepare Pages artifact
        run: |
          if [ -d dist/client ]; then
            OUT=dist/client
          elif [ -d dist ]; then
            OUT=dist
          else
            echo "Build output not found" && ls -la && exit 1
          fi
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}
      - id: deployment
        uses: actions/deploy-pages@v4
