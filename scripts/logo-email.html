<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 320px; background: transparent; overflow: hidden; }
      body {
        font-family: Cairo, "Segoe UI", Tahoma, sans-serif;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 28px;
        padding: 0 48px;
        direction: rtl;
      }
      .mark { width: 220px; height: 220px; flex-shrink: 0; object-fit: contain; }
      .text { display: flex; flex-direction: column; gap: 6px; }
      .name { font-size: 56px; font-weight: 900; color: #1a1a1a; line-height: 1.1; }
      .tag { font-size: 26px; font-weight: 700; color: #b8963a; }
      .en { font-size: 20px; font-weight: 600; color: #6e624e; letter-spacing: 0.04em; direction: ltr; }
    </style>
  </head>
  <body>
    <img class="mark" src="../public/brand/logo.png?v=8" alt="مكتب طوس العقارية" />
    <div class="text">
      <div class="name">مكتب طوس العقارية</div>
      <div class="tag">طوس العقارية</div>
      <div class="en">Tawoos Real Estate Office</div>
    </div>
  </body>
</html>
